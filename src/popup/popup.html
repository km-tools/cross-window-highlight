<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <img class="logo" src="../icons/icon32.png" alt="">
    <h1 data-i18n="extName"></h1>
  </header>

  <section class="card toggle-card">
    <div class="toggle-row">
      <div class="toggle-text">
        <span class="toggle-label" data-i18n="popupToggleLabel"></span>
        <span class="toggle-status" id="status"></span>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle">
        <span class="slider"></span>
      </label>
    </div>
    <p class="hint" id="hint"></p>
  </section>

  <section class="card">
    <h2 data-i18n="popupCurrentLabel"></h2>
    <p class="current" id="current"></p>
  </section>

  <section class="card">
    <h2 data-i18n="popupShortcutLabel"></h2>
    <div class="shortcut-row">
      <kbd id="shortcut"></kbd>
      <span class="muted" data-i18n="popupShortcutHint"></span>
    </div>
    <a href="#" id="open-shortcuts" class="link" data-i18n="popupShortcutOpen"></a>
    <p class="hint" data-i18n="popupEscHint"></p>
  </section>

  <section class="card pro" id="pro">
    <div class="pro-head">
      <h2 data-i18n="popupProTitle"></h2>
      <span class="badge" id="pro-badge"></span>
    </div>

    <!-- ライセンス -->
    <div class="license" id="license-form">
      <label class="field-label" for="license-key" data-i18n="popupLicenseLabel"></label>
      <div class="license-row">
        <input type="text" id="license-key" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX">
        <button type="button" id="license-activate" class="btn" data-i18n="popupLicenseActivate"></button>
      </div>
      <p class="hint license-msg" id="license-msg"></p>
      <a href="#" id="purchase" class="link" data-i18n="popupLicenseBuy" hidden></a>
    </div>
    <div class="license license-ok" id="license-info" hidden>
      <p class="license-line">
        <span data-i18n="popupLicenseActive"></span>
        <span class="muted" id="license-tail"></span>
      </p>
      <div class="license-actions">
        <a href="#" id="license-recheck" class="link" data-i18n="popupLicenseRecheck"></a>
        <a href="#" id="license-deactivate" class="link danger" data-i18n="popupLicenseDeactivate"></a>
      </div>
      <p class="hint license-msg" id="license-msg2"></p>
    </div>

    <!-- 設定 -->
    <fieldset class="settings" id="settings" disabled>
      <div class="row">
        <label for="s-markColor" data-i18n="popupSetMarkColor"></label>
        <input type="color" id="s-markColor">
      </div>
      <div class="row">
        <label for="s-inputColor" data-i18n="popupSetInputColor"></label>
        <input type="color" id="s-inputColor">
      </div>
      <div class="row">
        <label for="s-minLen" data-i18n="popupSetMinLen"></label>
        <input type="number" id="s-minLen" min="1" max="10" step="1">
      </div>
      <div class="row check">
        <input type="checkbox" id="s-hitBadge">
        <label for="s-hitBadge" data-i18n="popupSetHitBadge"></label>
      </div>
      <div class="row check">
        <input type="checkbox" id="s-multiKeyword">
        <label for="s-multiKeyword" data-i18n="popupSetMultiKeyword"></label>
      </div>
      <div class="row check">
        <input type="checkbox" id="s-iframes">
        <label for="s-iframes" data-i18n="popupSetIframes"></label>
      </div>
      <div class="row col">
        <label for="s-excludedDomains" data-i18n="popupSetExcluded"></label>
        <textarea id="s-excludedDomains" rows="3" placeholder="example.com&#10;mail.google.com"></textarea>
      </div>
      <button type="button" id="s-reset" class="link-btn" data-i18n="popupSetReset"></button>
    </fieldset>
  </section>

  <footer class="foot" id="version"></footer>

  <script src="../settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
